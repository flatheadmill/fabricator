[package]
name = "fabricator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "merge"
path = "src/merge.rs"

[[bin]]
name = "ingest"
path = "src/ingest.rs"

[[bin]]
name = "search"
path = "src/search.rs"

[[bin]]
name = "probe"
path = "src/probe.rs"

[[bin]]
name = "s2json"
path = "src/s2json.rs"

[[bin]]
name = "distance"
path = "src/distance.rs"

[[bin]]
name = "executor"
path = "src/executor.rs"

[[bin]]
name = "stats"
path = "src/stats.rs"

[[test]]
name = "predicate"
path = "tests/predicate.rs"

[[bin]]
name = "predicate"
path = "src/predicate/main.rs"

[[test]]
name = "predicate_worker"
path = "tests/predicate_worker.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { path = "../tantivy" }
clap = { version = "4", features = ["derive"] }
common = { package = "tantivy-common", path = "../tantivy/common" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
